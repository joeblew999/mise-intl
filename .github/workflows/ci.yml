# mise-intl's CI: its tests, misecheck on both its mise files, and the walk on the template and on a new repo, on
# Linux, macOS and Windows side by side. Shell steps only, as mise-cloudflare's and mise-check's: no JavaScript actions.
name: ci

on:
  push:
    tags: ["**"]
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # these steps are the workflow's own; mise runs the tasks in each OS's own shell
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # mise's GitHub downloads
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh, which fetches mise itself on Windows
      MISE_YES: "1"
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: mise and the pinned tools (mise.run, or mise's own Windows build)
        run: |
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$1"; else echo "$1"; fi; }
          mkdir -p "$HOME/.local/bin"
          native "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MISE_TRUSTED_CONFIG_PATHS=$(native "$PWD")" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            tag=$(gh release view -R jdx/mise --json tagName -q .tagName)
            curl -fsSL -o "$HOME/.local/bin/mise.exe" "https://github.com/jdx/mise/releases/download/$tag/mise-$tag-windows-x64.exe"
          else
            curl -fsSL https://mise.run | MISE_QUIET=1 sh
          fi
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$(native "$PWD")"
          mise --version
          mise install

      - name: Its tests, and misecheck on both its mise files (mise run tool:test, root:check-mise, template:check-mise)
        run: |
          mise run tool:test
          mise run root:check-mise
          mise run template:check-mise

      - name: The walk on the template, and on a new repo made from nothing (mise run template:e2e, new-repo:e2e)
        run: |
          mise run template:e2e
          mise run new-repo:e2e
