# mise-intl's own tasks, for working on it. Run every task here, at the top: everything is driven from this file, as
# mise-cloudflare's root is. The steps a person takes are a repo's own numbered tasks (intl:03-init to 14-prune, in its
# .mise/tasks). The walks (TestWalkTemplate, TestWalkNewRepo, e2e_walk_test.go) runs them in order, on the template or on a new repo made from it.
# This file is only what the root does itself, each task named for what it acts on (noun:verb):
#   template: the template, templates/, a whole repo that runs where it is
#     mise run template:setup        its own setup task: workerd from its package.json, in templates/node_modules
#     mise run template:gen          its messages package, which the module's own build and tests need (gen there)
#     mise run template:e2e          TestWalkTemplate on it: its numbered tasks in their order, through its own mise file, each checked
#     mise run template:check-mise   misecheck on its tasks file against mise-intl's Go, and against the walk
#   new-repo: a new repo, made as a person makes one (mise-intl init, then intl:template), by the walk and gone after it
#     mise run new-repo:e2e          TestWalkNewRepo on it, at this checkout's build (local) or the release --version names
#   tool: mise-intl itself, its command and its packages
#     mise run tool:build            its build, bin/mise-intl (.exe on Windows)
#     mise run tool:install          that build as the mise version local, the template's on this machine (and any repo's)
#     mise run tool:test             go vet, every Go test but the walk's, and the release config
#     mise run tool:release          a release from the commit checked out, as release.yml runs it (--dry-run)
#   root: this file
#     mise run root:check-mise       misecheck on this very file
# Each runs what it needs first: run the furthest you need.
#
# This repo's pins are mise-check's, by its own tasks in .mise/, which mise-check init wrote: mise run mise-check.

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]
# mise 2026.10 fails to install aube and usage while it fetches their agent skills (a 404); they aren't needed.
skills.fetch = false

[tools]
# The template's: its setup task installs workerd from its package.json with them, as mise-cloudflare's template gets
# wrangler (template:setup)
node = "26.13.0"
aube = { version = "2.9.0", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"] }
usage = { version = "7.2.0", workflow = "publish-cli.yml" }    # --help and tab-completion for the tasks' flags
goreleaser = "2.20.0"   # the release's binaries (.goreleaser.yaml)

[env]
# intl's Intl outside a Worker, for this repo's go test: the template's workerd (intl/workerd finds its native binary
# from this .bin)
_.path = ["{{config_root}}/templates/node_modules/.bin"]

[tasks."template:setup"]
description = "The template's own setup, by its own task (mise run setup, in templates/; its Go is this module's, go.mod's toolchain line): workerd from its package.json in templates/node_modules (aube install), the one intl's Intl runs on in this repo's tests and the walk. The machine's .mise/config.local.toml ignored, and the template's pin of mise-intl, which its setup doesn't run (so it works before mise-intl's first release)"
dir = "{{config_root}}/templates"
env = { MISE_IGNORED_CONFIG_PATHS = "{{config_root}}/templates/.mise/config.local.toml", MISE_DISABLE_TOOLS = "github:joeblew999/mise-intl" }
run = "mise run setup"

[tasks."template:gen"]
description = "The template's messages package (templates/locales/intl_gen.go), which go vet and go test of this module need: mise-intl gen, this checkout's, in the template"
depends = ["template:setup"]
dir = "{{config_root}}/templates"
run = "go run ../cmd/mise-intl gen"

[tasks."template:e2e"]
description = "TestWalkTemplate: the template, templates/, where it is: its numbered tasks (intl:03-init to 14-prune) in their order, through its own mise file, each checked by what a person would see it do (walk_test.go); the ones that change the catalogs run on a new repo. After tool:install"
depends = ["template:gen", "tool:install"]
run = 'go test . -run "^TestWalkTemplate$" -count=1 -v -timeout 15m'

[tasks."template:check-mise"]
description = "misecheck on the template's tasks file, both ways: against mise-intl's Go (each task's command is its file, each command file is a task's, each flag on both sides) and against the walk that runs them"
run = 'go test . -run "^TestTemplateMise$" -count=1 -v'

[tasks."new-repo:e2e"]
description = "TestWalkNewRepo: a new repo, made as a person makes one (an empty folder with its own git, mise-intl init, then its own intl:template: the template's app, its go.mod named for the folder), in a folder of its own that goes when the walk ends; every numbered task, the ones that change the catalogs too. It pins this checkout's build (local, its go.mod using this checkout's packages), or a release with --version, as the release tries it. After tool:install"
usage = 'flag "--version <version>" help="pin this release of mise-intl from GitHub, as mise use does, instead of the build of this checkout"'
depends = ["template:gen", "tool:install"]
run = 'go test . -run "^TestWalkNewRepo$" -count=1 -v -timeout 15m{% if usage.version %} -args -version "{{usage.version}}"{% endif %}'

[tasks."tool:build"]
description = "This repo's build, bin/mise-intl (mise-intl.exe on Windows: go build names it for the OS)"
run = "go build -o bin/ ./cmd/mise-intl"

[tasks."tool:install"]
description = "This repo's build as the mise version local, for any repo on this machine, no release: mise use github:joeblew999/mise-intl@local there. The template pins a release in .mise/config.toml; this writes templates/.mise/config.local.toml, never committed, so the template runs this build here"
depends = ["tool:build"]
run = "mise link -f github:joeblew999/mise-intl@local {{config_root}}/bin && mise use -q --path {{config_root}}/templates/.mise/config.local.toml github:joeblew999/mise-intl@local"

[tasks."tool:test"]
description = "go vet, every Go test, run for real (no cached results), and the release config: the walks run only when named, so they need nothing but this file's tools; Intl comes from the template's workerd (template:setup)"
depends = ["template:gen"]
run = "go vet ./... && go test -count=1 ./... && goreleaser check"

[tasks."tool:release"]
description = "A release of mise-intl from the commit checked out, as release.yml runs it on GitHub: the commit's v* tag, or the next patch version tagged and pushed; goreleaser's binaries on that tag's release; a new repo made pinning it and walked (new-repo:e2e --version); the version on proxy.golang.org (the packages an app imports). --dry-run tags and publishes nothing (a goreleaser snapshot into dist/). After tool:test"
usage = 'flag "--dry-run" help="tag and publish nothing: goreleaser builds a snapshot into dist/"'
depends = ["tool:test"]
run = 'go test . -run "^TestToolRelease$" -count=1 -v -timeout 30m{% if usage.dry_run %} -args -dry-run{% endif %}'

[tasks."root:check-mise"]
description = "TestRootMise on this repo's own mise.toml, the mise side: each task one line, the Go it runs there, its usage passed by name, no POSIX shell syntax, so every task here runs on Windows too. Not the Go side: the root runs Go, it isn't a binary's tasks (mise_test.go)"
run = 'go test . -run "^TestRootMise$" -count=1 -v'
