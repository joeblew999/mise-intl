# This repo's languages, with intl (github.com/joeblew999/mise-intl). Start with: mise run intl (what's done, and what to
# run next). One task per command, numbered in the order a repo meets them: mise run intl:<nn>-<command> runs
# go tool intl <command>, which Go builds from mise-intl's module at the version the repo's go.mod pins. Steps 00 to 02
# come before these tasks: the repo's git, its go.mod with intl's tool line, mise install. Each passes its usage values
# with mise's own templates ({{usage.<name>}}), never shell syntax, so it runs the same under sh, cmd and PowerShell.
# Written by go tool intl init: don't edit it. After upgrading intl, go tool intl init writes it again.

["intl"]
description = "Start here: what's done, and what to run next (mise run intl:show-help: every command)"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'go tool intl{% if usage.json %} --json{% endif %}'

["intl:03-init"]
description = "03. intl's files written into the repo again, after upgrading it (the first time, before these tasks: go tool intl init)"
usage = 'flag "--locales <ids>" help="the languages, comma-separated, the source first: en,de"; flag "--catalogs <dir>" help="the catalogs folder, locales"; flag "--gsxui <dir>" help="in a gsx app: where gsxui add puts its components"'
run = 'go tool intl init{% if usage.locales %} --locales "{{usage.locales}}"{% endif %}{% if usage.catalogs %} --catalogs "{{usage.catalogs}}"{% endif %}{% if usage.gsxui %} --gsxui "{{usage.gsxui}}"{% endif %}'

["intl:04-check"]
description = "04. Every problem, for CI: syntax, arguments, plural forms, missing and stale translations, unused messages, intl's files current (only the languages named, when there are any)"
usage = 'flag "--missing <how>" help="fail, or warn: missing and stale translations only reported (default: INTL_MISSING, else warn on a GitHub pull request, else fail)"; arg "[locales]..." help="only these languages: de fr"'
run = 'go tool intl check{% if usage.missing %} --missing "{{usage.missing}}"{% endif %}{% for a in usage.locales %} "{{a}}"{% endfor %}'

["intl:05-show"]
description = "05. What's done, and what to run next"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'go tool intl show{% if usage.json %} --json{% endif %}'

["intl:06-gen"]
description = "06. The catalogs compiled into the app's messages package (locales/intl_gen.go), and intl.sum"
run = "go tool intl gen"

["intl:07-status"]
description = "07. Per language: translated, inherited, stale, missing (fails while one is incomplete)"
run = "go tool intl status"

["intl:08-add-locale"]
description = "08. A language added: its id as Intl writes it, into intl.toml, and its catalog"
usage = 'arg "<locales>..." help="the languages to add: fr pt-BR"'
run = 'go tool intl add-locale{% for a in usage.locales %} "{{a}}"{% endfor %}'

["intl:09-todo"]
description = "09. What's left to translate, with what a translator needs (for people, or --json for agents)"
usage = 'flag "--json" help="one JSON document on stdout, for agents"; arg "[locales]..." help="only these languages"'
run = 'go tool intl todo{% if usage.json %} --json{% endif %}{% for a in usage.locales %} "{{a}}"{% endfor %}'

["intl:10-translate"]
description = "10. Claude Code translates what's left, a worker per language, with the intl skill"
usage = 'arg "[locales]..." help="only these languages"'
run = 'go tool intl translate{% for a in usage.locales %} "{{a}}"{% endfor %}'

["intl:11-export"]
description = "11. XLIFF 2.0 for translators: what's left (or everything), into xliff/out"
usage = 'flag "--all" help="every message, not only what is left"; flag "--out <dir>" help="the folder for <locale>.xlf, xliff/out"; arg "[locales]..." help="only these languages"'
run = 'go tool intl export{% if usage.all %} --all{% endif %}{% if usage.out %} --out "{{usage.out}}"{% endif %}{% for a in usage.locales %} "{{a}}"{% endfor %}'

["intl:12-import"]
description = "12. Translators' XLIFF read back into the catalogs (every file in xliff/in, by default)"
usage = 'arg "[files]..." help="the .xlf files: xliff/in/fr.xlf"'
run = 'go tool intl import{% for a in usage.files %} "{{a}}"{% endfor %}'

["intl:13-confirm"]
description = "13. Stale translations that are still right, kept: a language's, or one message's (every one of them, by default)"
usage = 'arg "[keys]..." help="de, or de:home.title"'
run = 'go tool intl confirm{% for a in usage.keys %} "{{a}}"{% endfor %}'

["intl:14-prune"]
description = "14. The keys the source no longer has, removed from every catalog"
run = "go tool intl prune"

["intl:verify"]
description = "What the repo's GitHub workflow runs: its setup and test tasks, then check"
run = "go tool intl verify"

["intl:template"]
description = "The template's little app, a page of intl's formats in English and German, in a repo with no app yet: it never writes over a file"
run = "go tool intl template"

["intl:add"]
description = "In a gsx app: intl's screens, copied in as gsxui components (language-list, language-offer, preferences), their text translated"
usage = 'flag "--diff" help="how the copies in the app differ, writing nothing"; flag "--overwrite" help="replace copies the app changed"; arg "<screens>..." help="language-list language-offer preferences"'
run = 'go tool intl add{% if usage.diff %} --diff{% endif %}{% if usage.overwrite %} --overwrite{% endif %}{% for a in usage.screens %} "{{a}}"{% endfor %}'

["intl:assets"]
description = "The JavaScript a Worker and a page import: intl's own, and the app's catalogs"
usage = 'flag "--worker <dir>" help="the folder for a Worker build: its modules"; flag "--browser <dir>" help="the folder a page loads its modules from"'
run = 'go tool intl assets{% if usage.worker %} --worker "{{usage.worker}}"{% endif %}{% if usage.browser %} --browser "{{usage.browser}}"{% endif %}'

["intl:locales"]
description = "The shipped languages, comma-separated"
run = "go tool intl locales"

["intl:catalogs"]
description = "The catalogs' Go package name"
run = "go tool intl catalogs"

["intl:markup"]
description = "The app's own markup files, for gsx's checks"
run = "go tool intl markup"

["intl:show-version"]
description = "This build's version: the module version go.mod pins"
run = "go tool intl show-version"

["intl:show-help"]
description = "Every command"
run = "go tool intl show-help"
