# A Go app's own tools: Go (go.mod's toolchain line), workerd, which intl's Intl runs on outside a Worker, and what
# downloads the modules go.mod pins (mise run setup). intl itself comes from go.mod (go tool intl): its tasks are
# .mise/tasks/intl.toml, which go tool intl init writes (then mise run intl shows the way).

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]

[tools]
workerd = "1.20261104.1"   # intl's Intl outside a Worker: go tool intl, go test, the app itself (intl/workerd)

[tasks.setup]
description = "Download the modules go.mod pins, intl's among them"
run = "go mod download"

[tasks.serve]
description = "Run the app: http://localhost:8080 (ADDR to change it)"
run = "go run ./app"

[tasks.test]
description = "The app's own tests (intl:verify runs them, then check)"
run = "go test ./..."
