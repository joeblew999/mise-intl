# A Go app's own tools: workerd, which intl's Intl runs on outside a Worker, from package.json, as mise-cloudflare's
# template gets wrangler (mise run setup installs it, and the modules go.mod pins). mise-intl itself is
# .mise/config.toml's pin, with the Go its tasks run with (go.mod's); its tasks are .mise/tasks/mise-intl.toml: mise-intl
# init writes them (then mise run intl shows the way).

[settings]
# mise 2026.10 fails to install aube while it fetches its agent skill (a 404); it isn't needed.
skills.fetch = false

[tools]
node = "26.13.0"   # runs workerd's npm package
aube = { version = "2.8.4", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"] }     # installs workerd from package.json
pitchfork = "2.33.1"   # runs workerd as the app's intl daemon (pitchfork.toml)

[env]
# workerd's npm bin, where intl finds it (intl/workerd: node_modules/.bin, then the PATH)
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.setup]
description = "Install the pinned workerd (package.json), and download the modules go.mod pins, intl's among them"
run = "aube install && go mod download"

[tasks.serve]
description = "Run the app: http://localhost:8080 (ADDR to change it)"
run = "go run ./app"

[tasks.test]
description = "The app's own tests (intl:verify runs them, then check)"
run = "go test ./..."
